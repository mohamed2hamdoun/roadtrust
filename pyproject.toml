[project]
name = "roadtrust"
version = "0.0.0"
description = "Receiver-side V2X misbehavior detection with explanations and verifiable evidence"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core/roadtrust"]

[tool.pytest.ini_options]
testpaths = ["core/tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
